{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="{% static 'article.css' %}">
</head>
<body class="article">
    <div class="header">
        <div class="auth-links">
            <a href="{% url 'register' %}">Регистрация</a> | 
            <a href="{% url 'user_login' %}">Вход</a>
        </div>
        <a href="{% url 'archive' %}" class="all-posts-link">Все статьи</a>
        <img src="{% static 'logo.png' %}" alt="Логотип">
    </div>
    
    <div class="content">
        <h1>{{ post.title }}</h1>
        <div class="article-info">
            <div class="article-author">{{ post.author.username }}</div>
            <div class="article-created-date">{{ post.created_date }}</div>
        </div>
        <p class="article-text">{{ post.text }}</p>
    </div>
</body>
</html>
