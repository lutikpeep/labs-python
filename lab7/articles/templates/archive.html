{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Архив статей</title>
    <link rel="stylesheet" href="{% static 'article.css' %}">
</head>
<body class="archive">
    <div class="header">
        <div class="auth-links">
            <a href="{% url 'register' %}">Регистрация</a> | 
            <a href="{% url 'user_login' %}">Вход</a>
        </div>
        <img src="{% static 'logo.png' %}" alt="Логотип">
        <h1>Мой Django Блог</h1>
    </div>
    
    <div class="archive">
        {% for post in posts %}
            <div class="one-post">
                <h2 class="post-title"><a href="{% url 'get_article' post.id %}">{{ post.title }}</a></h2>
                <div class="article-info">
                    <div class="article-author">{{ post.author.username }}</div>
                    <div class="article-created-date">{{ post.created_date }}</div>
                </div>
				<button class="fold-button">свернуть</button>
                <p class="article-text">{{ post.get_excerpt }}</p>
            </div>
        {% endfor %}
    </div>
	<script src="{% static 'js/helloworld.js' %}"></script>
	<script src="{% static 'js/fold-post.js' %}"></script>
</body>
</html>
