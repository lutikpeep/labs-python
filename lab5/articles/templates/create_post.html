{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Создать статью</title>
    <link rel="stylesheet" href="{% static 'article.css' %}">
</head>
<body class="content">
    <h1>Написать статью</h1>
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 10px;">
            <input type="text" name="title" placeholder="Название статьи" value="{{ form.title }}" style="width: 100%; padding: 5px;">
        </div>
        <div style="margin-bottom: 10px;">
            <textarea name="text" placeholder="Текст статьи" style="width: 100%; height: 150px; padding: 5px;">{{ form.text }}</textarea>
        </div>
        <input type="submit" value="Сохранить" style="padding: 10px 20px; cursor: pointer;">
    </form>
    <p style="color: red; font-weight: bold;">{{ form.errors }}</p>
    <br>
    <a href="{% url 'archive' %}" style="color: white;">← Вернуться на главную</a>
</body>
</html>
