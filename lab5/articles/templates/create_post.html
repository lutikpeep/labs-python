{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Создать статью</title>
    <link rel="stylesheet" href="{% static 'article.css' %}">
</head>
<body class="content">
    <div class="form-container">
        <h1>Написать статью</h1>
        <form method="POST">
            {% csrf_token %}
            
            <input type="text" name="title" placeholder="Название статьи" value="{{ form.title }}">
            
            <textarea name="text" placeholder="Текст статьи">{{ form.text }}</textarea>
            
            <input type="submit" value="Сохранить" class="submit-btn">
        </form>
        
        <p class="error-msg">{{ form.errors }}</p>
        <br>
        <a href="{% url 'archive' %}" class="back-link">← Вернуться на главную</a>
    </div>
</body>
</html>
